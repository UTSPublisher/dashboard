<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTS Publisher Sales Dashboard</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-slate);
      color: var(--text-main);
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .title-area h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Filters Section */
    .controls-card {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-box i.fa-search {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 10px 36px 10px 36px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      display: none; /* Toggled dynamically via JS */
      background: none;
      border: none;
      font-size: 0.9rem;
    }

    .clear-btn:hover {
      color: var(--text-main);
    }

    .filter-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group select {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .kpi-details span {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-details h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Analytics Charts Section */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 992px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .chart-card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    /* Sales Item Cards Grid */
    .sales-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .sale-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .sale-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .sale-card .card-header {
      margin-bottom: 12px;
    }

    .sale-card .book-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      line-height: 1.3;
    }

    .sale-card .book-title:hover {
      text-decoration: underline;
    }

    .sale-card .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
    }

    .sale-card .card-body {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .sale-card .card-footer {
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 90%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-body-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .modal-body-row span:first-child {
      color: var(--text-muted);
    }

    .modal-body-row span:last-child {
      font-weight: 600;
    }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>UTS Publisher Dashboard</h1>
      <p>Sales Performance & Book Distribution Analytics</p>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls-card">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass fa-search"></i>
      <input type="text" id="search-input" placeholder="Search by title, author, or buyer...">
      <button class="clear-btn" id="clear-search-btn" title="Clear Search">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="filter-group">
      <select id="year-filter">
        <option value="ALL">All Years</option>
      </select>
      <select id="category-filter">
        <option value="ALL">All Categories</option>
      </select>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon"><i class="fa-solid fa-dollar-sign"></i></div>
      <div class="kpi-details">
        <span>Total Revenue</span>
        <h3 id="kpi-revenue">RM 0.00</h3>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon"><i class="fa-solid fa-book"></i></div>
      <div class="kpi-details">
        <span>Copies Sold</span>
        <h3 id="kpi-copies">0</h3>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon"><i class="fa-solid fa-receipt"></i></div>
      <div class="kpi-details">
        <span>Transactions</span>
        <h3 id="kpi-transactions">0</h3>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon"><i class="fa-solid fa-layer-group"></i></div>
      <div class="kpi-details">
        <span>Top Category</span>
        <h3 id="kpi-top-category">-</h3>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Sales & Volume Performance</h2>
      <div class="chart-container">
        <canvas id="salesTimelineChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h2>Customer Type Distribution</h2>
      <div class="chart-container">
        <canvas id="customerChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Sales Cards Grid -->
  <div class="sales-grid" id="sales-grid">
    <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading sales data...</div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="sale-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Book Details</h2>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div id="modal-content">
        <!-- Dynamic fields populates here -->
      </div>
    </div>
  </div>

  <script>
    // Replace this URL with your published Google Apps Script Web App Endpoint
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7hCwlPq2CDdNTmjcvqTfEmpW_x-hM47n_OS9YDyukqMh9Yd8EhjOtrxX1dq-bKNUx/exec";

    let rawSalesData = [];
    let filteredSalesData = [];
    let salesChartInstance = null;
    let customerChartInstance = null;

    // --- 1. Helper Functions ---
    
    /**
     * Robustly parses various date formats into standard Date objects.
     */
    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      if (dateStr instanceof Date) return dateStr;

      const str = String(dateStr).trim();

      // Standard YYYY-MM-DD or ISO formats
      if (str.match(/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/)) {
        const parsed = new Date(str);
        if (!isNaN(parsed)) return parsed;
      }

      // DD/MM/YYYY or MM/DD/YYYY formats
      const parts = str.split(/[-/.]/);
      if (parts.length === 3) {
        let day, month, year;
        if (parts[0].length === 4) {
          // YYYY-MM-DD
          [year, month, day] = parts.map(Number);
        } else if (parts[2].length === 4) {
          // Assume DD/MM/YYYY
          [day, month, year] = parts.map(Number);
        }

        if (year && month && day) {
          return new Date(year, month - 1, day);
        }
      }

      const fallback = new Date(str);
      return isNaN(fallback) ? new Date(0) : fallback;
    }

    function formatCurrency(val) {
      return 'RM ' + Number(val || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // --- 2. Data Fetching & Processing ---
    async function fetchSalesData() {
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();
        
        // Map and sanitize row data
        rawSalesData = data.map(item => ({
          dateOfPurchase: item.dateOfPurchase || item.date || '',
          parsedDate: parseDate(item.dateOfPurchase || item.date || ''),
          bookTitle: item.bookTitle || 'Untitled',
          author: item.author || 'Unknown Author',
          category: item.category || 'General',
          customerType: item.customerType || 'Individual',
          buyerName: item.buyerName || 'N/A',
          quantity: Number(item.quantity) || 0,
          costPerUnit: Number(item.costPerUnit) || 0,
          retailPrice: Number(item.retailPrice) || 0,
          totalSalesValue: Number(item.totalSalesValue) || 0,
          totalRevenue: Number(item.totalRevenue) || (Number(item.quantity || 0) * Number(item.retailPrice || 0))
        }));

        populateFilterOptions();
        filterData();
      } catch (err) {
        console.error("Error fetching data:", err);
        document.getElementById('sales-grid').innerHTML = `
          <div class="loading-spinner" style="color: #ef4444;">
            <i class="fa-solid fa-triangle-exclamation"></i> Failed to load sales data. Please check Web App URL & permissions.
          </div>`;
      }
    }

    // --- 3. Filter Population & Execution ---
    function populateFilterOptions() {
      const yearSelect = document.getElementById('year-filter');
      const categorySelect = document.getElementById('category-filter');

      const years = new Set();
      const categories = new Set();

      rawSalesData.forEach(item => {
        const yr = item.parsedDate.getFullYear();
        if (yr && yr !== 1970) years.add(yr);
        if (item.category) categories.add(item.category);
      });

      Array.from(years).sort((a,b) => b - a).forEach(yr => {
        yearSelect.innerHTML += `<option value="${yr}">${yr}</option>`;
      });

      Array.from(categories).sort().forEach(cat => {
        categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedYear = document.getElementById('year-filter').value;
      const selectedCategory = document.getElementById('category-filter').value;

      filteredSalesData = rawSalesData.filter(item => {
        const matchesQuery = 
          item.bookTitle.toLowerCase().includes(query) ||
          item.author.toLowerCase().includes(query) ||
          item.buyerName.toLowerCase().includes(query);

        const matchesYear = (selectedYear === 'ALL') || 
          (item.parsedDate.getFullYear().toString() === selectedYear);

        const matchesCategory = (selectedCategory === 'ALL') || 
          (item.category === selectedCategory);

        return matchesQuery && matchesYear && matchesCategory;
      });

      // Sort by date descending for display
      filteredSalesData.sort((a, b) => b.parsedDate - a.parsedDate);

      updateKPIs();
      renderCharts();
      renderSalesGrid();
    }

    // --- 4. Render Components ---
    function updateKPIs() {
      let totalRevenue = 0;
      let totalCopies = 0;
      const categoryMap = {};

      filteredSalesData.forEach(item => {
        totalRevenue += item.totalRevenue;
        totalCopies += item.quantity;
        categoryMap[item.category] = (categoryMap[item.category] || 0) + item.totalRevenue;
      });

      let topCategory = '-';
      let maxRev = 0;
      Object.keys(categoryMap).forEach(cat => {
        if (categoryMap[cat] > maxRev) {
          maxRev = categoryMap[cat];
          topCategory = cat;
        }
      });

      document.getElementById('kpi-revenue').innerText = formatCurrency(totalRevenue);
      document.getElementById('kpi-copies').innerText = totalCopies.toLocaleString();
      document.getElementById('kpi-transactions').innerText = filteredSalesData.length.toLocaleString();
      document.getElementById('kpi-top-category').innerText = topCategory;
    }

    function renderCharts() {
      // 1. Sales Performance Timeline Grouping by Year/Month
      const timeMap = {};
      filteredSalesData.forEach(item => {
        const key = item.parsedDate.getFullYear() !== 1970 
          ? `${item.parsedDate.getFullYear()}-${String(item.parsedDate.getMonth() + 1).padStart(2, '0')}`
          : 'Unknown';
        
        if (!timeMap[key]) timeMap[key] = { revenue: 0, quantity: 0 };
        timeMap[key].revenue += item.totalRevenue;
        timeMap[key].quantity += item.quantity;
      });

      const sortedTimeKeys = Object.keys(timeMap).sort();
      const timelineLabels = sortedTimeKeys;
      const revenueData = sortedTimeKeys.map(k => timeMap[k].revenue);
      const quantityData = sortedTimeKeys.map(k => timeMap[k].quantity);

      if (salesChartInstance) salesChartInstance.destroy();
      const ctxSales = document.getElementById('salesTimelineChart').getContext('2d');
      salesChartInstance = new Chart(ctxSales, {
        type: 'bar',
        data: {
          labels: timelineLabels,
          datasets: [
            {
              label: 'Revenue (RM)',
              data: revenueData,
              backgroundColor: '#2563eb',
              yAxisID: 'y'
            },
            {
              label: 'Copies Sold',
              data: quantityData,
              type: 'line',
              borderColor: '#f59e0b',
              backgroundColor: '#f59e0b',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: 'Revenue (RM)' } },
            y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Quantity' } }
          }
        }
      });

      // 2. Customer Type Breakdown
      const customerMap = {};
      filteredSalesData.forEach(item => {
        customerMap[item.customerType] = (customerMap[item.customerType] || 0) + item.totalRevenue;
      });

      if (customerChartInstance) customerChartInstance.destroy();
      const ctxCustomer = document.getElementById('customerChart').getContext('2d');
      customerChartInstance = new Chart(ctxCustomer, {
        type: 'doughnut',
        data: {
          labels: Object.keys(customerMap),
          datasets: [{
            data: Object.values(customerMap),
            backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    function renderSalesGrid() {
      const grid = document.getElementById('sales-grid');
      
      if (filteredSalesData.length === 0) {
        grid.innerHTML = `<div class="loading-spinner">No sales records found.</div>`;
        return;
      }

      grid.innerHTML = filteredSalesData.map((item, index) => `
        <div class="sale-card">
          <div>
            <div class="card-header">
              <div class="book-title" onclick="openModal(${index})">${item.bookTitle}</div>
              <span class="badge">${item.category}</span>
            </div>
            <div class="card-body">
              <div><i class="fa-regular fa-user"></i> ${item.author}</div>
              <div><i class="fa-solid fa-building"></i> ${item.buyerName} (${item.customerType})</div>
              <div><i class="fa-regular fa-calendar"></i> ${item.parsedDate.toLocaleDateString() || item.dateOfPurchase}</div>
            </div>
          </div>
          <div class="card-footer">
            <span>Qty: ${item.quantity}</span>
            <span style="color: var(--primary);">${formatCurrency(item.totalRevenue)}</span>
          </div>
        </div>
      `).join('');
    }

    // --- 5. Modal Display ---
    function openModal(index) {
      const item = filteredSalesData[index];
      if (!item) return;

      document.getElementById('modal-title').innerText = item.bookTitle;
      document.getElementById('modal-content').innerHTML = `
        <div class="modal-body-row"><span>Author</span><span>${item.author}</span></div>
        <div class="modal-body-row"><span>Category</span><span>${item.category}</span></div>
        <div class="modal-body-row"><span>Buyer Name</span><span>${item.buyerName}</span></div>
        <div class="modal-body-row"><span>Customer Type</span><span>${item.customerType}</span></div>
        <div class="modal-body-row"><span>Date of Purchase</span><span>${item.parsedDate.toLocaleDateString()}</span></div>
        <div class="modal-body-row"><span>Quantity Sold</span><span>${item.quantity}</span></div>
        <div class="modal-body-row"><span>Cost Per Unit</span><span>${formatCurrency(item.costPerUnit)}</span></div>
        <div class="modal-body-row"><span>Retail Price</span><span>${formatCurrency(item.retailPrice)}</span></div>
        <div class="modal-body-row"><span>Total Sales Value</span><span>${formatCurrency(item.totalSalesValue)}</span></div>
        <div class="modal-body-row"><span>Total Revenue</span><span style="color: var(--primary);">${formatCurrency(item.totalRevenue)}</span></div>
      `;

      document.getElementById('sale-modal').classList.add('active');
    }

    // --- 6. Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search-btn');

      // Toggle clear button & trigger filtering on search input
      searchInput.addEventListener('input', (e) => {
        if (clearBtn) {
          clearBtn.style.display = e.target.value.trim() ? 'block' : 'none';
        }
        filterData();
      });

      // Clear input event listener
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          searchInput.value = '';
          clearBtn.style.display = 'none';
          searchInput.focus();
          filterData();
        });
      }

      // Filter select listeners
      document.getElementById('year-filter').addEventListener('change', filterData);
      document.getElementById('category-filter').addEventListener('change', filterData);

      // Modal close listener
      document.getElementById('modal-close-btn').addEventListener('click', () => {
        document.getElementById('sale-modal').classList.remove('active');
      });

      // Close modal on background overlay click
      document.getElementById('sale-modal').addEventListener('click', (e) => {
        if (e.target.id === 'sale-modal') {
          document.getElementById('sale-modal').classList.remove('active');
        }
      });

      // Fetch initial data
      fetchSalesData();
    });
  </script>
</body>
</html>
